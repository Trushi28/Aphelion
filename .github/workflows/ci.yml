name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.plan.outputs.units }}
      boot: ${{ steps.plan.outputs.boot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select what to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          range=""
          case "$EVENT" in
            pull_request) range="origin/$BASE_REF...$AFTER" ;;
            push) range="$BEFORE..$AFTER" ;;
          esac
          tools/ci-affected.sh "$range" | tee -a "$GITHUB_OUTPUT"

  host-tests:
    needs: plan
    if: needs.plan.outputs.units != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ join(fromJSON(needs.plan.outputs.units), ', ') }}
        env:
          UNITS: ${{ join(fromJSON(needs.plan.outputs.units), ' ') }}
        run: |
          targets=""
          for u in $UNITS; do targets="$targets test-$u"; done
          make -k -j"$(nproc)" -O $targets

  iso:
    needs: plan
    if: needs.plan.outputs.boot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso mtools

      - name: Build the self-test image
        run: make test-iso MENU_TIMEOUT=0

      - name: Build the shell image
        run: make iso MENU_TIMEOUT=0 ISO=build/aphelion-shell.iso

      - name: Build the USB image
        run: make iso PROFILE=usb MENU_TIMEOUT=0 ISO=build/aphelion-usb.iso

      - name: Build host filesystem tools
        run: make stellarfs

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            build/aphelion-test.iso
            build/aphelion-shell.iso
            build/aphelion-usb.iso
            build/stellarfs
          if-no-files-found: error

  boot:
    needs: iso
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { disk: nvme, cores: 1 }
          - { disk: nvme, cores: 4 }
          - { disk: ahci, cores: 1 }
          - { disk: virtio, cores: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot on ${{ matrix.disk }}, ${{ matrix.cores }} core(s)
        run: tools/ci-boot.sh ${{ matrix.disk }} ${{ matrix.cores }}
      - name: Boot timings
        if: always()
        run: |
          for f in build/ci-logs/*.time; do
            [ -e "$f" ] || continue
            echo "== $(basename "$f" .time)"
            cat "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs-${{ matrix.disk }}-${{ matrix.cores }}
          path: build/ci-logs
          if-no-files-found: ignore

  shell:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot the shell
        run: tools/ci-shell.sh 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs-shell
          path: build/ci-logs
          if-no-files-found: ignore

  usb:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot from a USB stick
        run: tools/ci-usb.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs-usb
          path: build/ci-logs
          if-no-files-found: ignore

  crash-fuzz:
    needs: iso
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { disk: nvme, rounds: 16 }
          - { disk: ahci, rounds: 10 }
          - { disk: virtio, rounds: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: build
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Crash fuzz, ${{ matrix.disk }}
        run: |
          chmod +x build/stellarfs
          tools/crash-fuzz.sh ${{ matrix.disk }} 1 ${{ matrix.rounds }} 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-logs-fuzz-${{ matrix.disk }}
          path: build/ci-logs
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [plan, host-tests, iso, boot, shell, usb, crash-fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Everything that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
