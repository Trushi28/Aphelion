name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso mtools qemu-system-x86 qemu-utils

      - name: Build
        run: make iso MENU_TIMEOUT=0

      - name: Filesystem tests
        run: make test-stellar

      - name: Memory tests
        run: make test-mm

      - name: Scheduler and boot configuration tests
        run: make test-sched

      - name: Console tests
        run: make test-console

      - name: Input tests
        run: make test-input

      - name: Nebula namespace tests
        run: make test-nebula

      - name: Helm shell tests
        run: make test-helm

      - name: USB protocol and storage tests
        run: make test-usb test-usbstor

      - name: Boot on NVMe, 1 core
        run: tools/ci-boot.sh nvme 1

      - name: Boot on NVMe, 4 cores
        run: tools/ci-boot.sh nvme 4

      - name: Boot on AHCI
        run: tools/ci-boot.sh ahci 1

      - name: Boot on virtio-blk
        run: tools/ci-boot.sh virtio 1

      - name: Boot the shell
        run: |
          make iso BOOT_DEFAULT=shell MENU_TIMEOUT=0 ISO=build/aphelion-shell.iso
          tools/ci-shell.sh 2

      - name: Boot from a USB stick
        run: |
          make iso PROFILE=usb MENU_TIMEOUT=0 ISO=build/aphelion-usb.iso
          tools/ci-usb.sh

      - name: Build host filesystem tools
        run: make stellarfs

      - name: Crash fuzz, NVMe
        run: tools/crash-fuzz.sh nvme 1 16 7

      - name: Crash fuzz, AHCI
        run: tools/crash-fuzz.sh ahci 1 10 7

      - name: Crash fuzz, virtio-blk
        run: tools/crash-fuzz.sh virtio 1 10 7

      - name: Boot timings
        if: always()
        run: |
          for f in build/ci-logs/*.time; do
            [ -e "$f" ] || continue
            echo "== $(basename "$f" .time)"
            cat "$f"
          done

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: build/ci-logs
          if-no-files-found: ignore
